- type: premiss-audio
  text: |
    Today, ducklings. We will learn to quack.

    Focus. Take a deep breath. And—

    Again. Fill your lungs. And—

    Excellent.

    Now. Basic phrases.
    Hello — quack. How are you — quaack?
    Nice weather — quaaack. Got anything to eat — quack quack quack.

    Let us practice together.

    Hello!

    Got anything to eat?

    Excellent work.

    Homework. Thirty times — hello.
    Forty times — got anything to eat. Test tomorrow.

    Class dismissed.

    Dear viewer. You now know basic Quackish.
    Try it next time you meet a duck.
