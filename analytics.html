:root[data-theme="light"]{--bg:#F5F3EE;--bg2:#ECEAE4;--bg3:#E0DDD6;--text:#1C1814;--text2:#5C5650;--text3:#948E88;--border:#D8D4CC;--accent:#D95A20;--accent2:#F0E8E0;--c-short:#C47208;--c-short-bg:#FFF3DC;--c-parable:#3870A8;--c-parable-bg:#DCF0FF;--c-animal:#38905A;--c-animal-bg:#DDF0E8;--c-legacy:#808080;--c-legacy-bg:#EEEEEE;--bar:#D8D4CC}
:root[data-theme="dark"]{--bg:#0C1520;--bg2:#101E2C;--bg3:#162438;--text:#E4E0D8;--text2:#A09888;--text3:#687080;--border:#1A3050;--accent:#E86830;--accent2:#1C1008;--c-short:#E8A030;--c-short-bg:#1C1200;--c-parable:#60A0E0;--c-parable-bg:#080C20;--c-animal:#50B878;--c-animal-bg:#041008;--c-legacy:#909090;--c-legacy-bg:#141414;--bar:#1A3050}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.5}

.shell{max-width:1020px;margin:0 auto;padding:32px 20px 72px}

/* Header */
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:28px;flex-wrap:wrap}
.ch-name{font-family:Georgia,'Times New Roman',serif;font-size:20px;letter-spacing:-0.02em;color:var(--text)}
.ch-name em{color:var(--accent);font-style:normal}
.hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hdr-meta{font-size:12px;color:var(--text3)}
.btn{background:var(--bg2);border:1px solid var(--border);color:var(--text2);font-size:12px;padding:4px 10px;border-radius:4px;cursor:pointer;font-family:inherit}
.btn:hover{color:var(--text)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px}
@media(max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:14px 16px}
.kpi-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--text3);margin-bottom:5px}
.kpi-val{font-family:'SF Mono','Fira Mono',monospace;font-size:26px;font-variant-numeric:tabular-nums;line-height:1;color:var(--text)}
.kpi-val.hi{color:var(--accent)}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:3px}
.kpi-sub i{font-family:Georgia,serif;font-style:italic}

/* Section label */
.slabel{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:8px}

/* Chart */
.chart-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:18px 18px 12px;margin-bottom:28px}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.chart-title{font-size:13px;font-weight:600;color:var(--text2)}
.legend{display:flex;gap:14px;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
canvas{display:block;width:100%}

/* Sort controls */
.sort-row{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.sort-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3)}
.sort-btn{background:var(--bg2);border:1px solid var(--border);color:var(--text2);font-size:11px;padding:3px 10px;border-radius:3px;cursor:pointer;font-family:inherit}
.sort-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* Table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;margin-bottom:28px}
table{width:100%;border-collapse:collapse;min-width:600px}
thead th{background:var(--bg2);padding:9px 12px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);font-weight:700;white-space:nowrap;cursor:pointer;border-bottom:1px solid var(--border)}
thead th:hover{color:var(--text)}
thead th.sorted{color:var(--accent)}
thead th.r{text-align:right}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg2)}
tbody tr.dim{opacity:.45}
td{padding:9px 12px;vertical-align:middle}
td.r{text-align:right;font-family:'SF Mono','Fira Mono',monospace;font-variant-numeric:tabular-nums;font-size:12px;color:var(--text2);white-space:nowrap}
td.r.bold{color:var(--text);font-weight:700}
.vid-title{font-family:Georgia,'Times New Roman',serif;font-size:13px;line-height:1.35;color:var(--text)}
.vid-title a{color:inherit;text-decoration:none}
.vid-title a:hover{color:var(--accent)}
.vid-date{font-size:11px;color:var(--text3);white-space:nowrap}
.badge{display:inline-block;font-size:9px;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:3px;font-weight:700;white-space:nowrap}
.b-short   {background:var(--c-short-bg);  color:var(--c-short)}
.b-parable {background:var(--c-parable-bg);color:var(--c-parable)}
.b-animal  {background:var(--c-animal-bg); color:var(--c-animal)}
.b-legacy  {background:var(--c-legacy-bg); color:var(--c-legacy)}
.bar-cell{width:80px;padding-right:12px}
.bt{height:4px;background:var(--bar);border-radius:2px;overflow:hidden}
.bf{height:100%;border-radius:2px;transition:width .3s}

/* Format breakdown */
.fmtgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px}
@media(max-width:700px){.fmtgrid{grid-template-columns:repeat(2,1fr)}}
.fmtcard{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--fc,var(--border));border-radius:6px;padding:14px 16px}
.fmtcard-name{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--fc,var(--text3));margin-bottom:10px}
.fmtstats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.fs-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.fs-val{font-family:'SF Mono','Fira Mono',monospace;font-size:17px;font-variant-numeric:tabular-nums;color:var(--text);margin-top:1px}
</style>

const YT = "https://youtube.com/shorts/";
const FMT = {
  "short-motivation": {label:"Short",    cls:"b-short",   color:"#C47208"},
  "parable":          {label:"Parable",  cls:"b-parable", color:"#3870A8"},
  "parable-classic":  {label:"Parable",  cls:"b-parable", color:"#3870A8"},
  "parable-animal":   {label:"Animal",   cls:"b-animal",  color:"#38905A"},
  "legacy":           {label:"Other",    cls:"b-legacy",  color:"#808080"},
  "long-monologue":   {label:"Other",    cls:"b-legacy",  color:"#808080"},
};
function fmtOf(v){ return FMT[v.format] || FMT["legacy"]; }
function isDark(){ return document.documentElement.getAttribute("data-theme")==="dark" || (!document.documentElement.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme:dark)").matches); }

// ── KPIs ──
function renderKPIs(){
  const pub = VIDEOS.filter(v=>v.privacy==="public");
  const totalV = pub.reduce((s,v)=>s+v.views,0);
  const avgVpd = pub.length ? (pub.reduce((s,v)=>s+v.vpd,0)/pub.length).toFixed(1) : 0;
  const best = pub.reduce((a,b)=>b.views>a.views?b:a, pub[0]||{});
  const bestVpd = pub.reduce((a,b)=>b.vpd>a.vpd?b:a, pub[0]||{});
  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><div class="kpi-lbl">Total Views</div><div class="kpi-val hi">${totalV.toLocaleString()}</div><div class="kpi-sub">${pub.length} public / ${VIDEOS.length} total</div></div>
    <div class="kpi"><div class="kpi-lbl">Avg Views/Day</div><div class="kpi-val">${avgVpd}</div><div class="kpi-sub">public videos</div></div>
    <div class="kpi"><div class="kpi-lbl">Best Raw</div><div class="kpi-val">${best.views||0}</div><div class="kpi-sub"><i>${(best.title||'').slice(0,34)}…</i></div></div>
    <div class="kpi"><div class="kpi-lbl">Best V/Day</div><div class="kpi-val">${bestVpd.vpd||0}</div><div class="kpi-sub"><i>${(bestVpd.title||'').slice(0,34)}…</i></div></div>`;
  document.getElementById("hdr-meta").textContent = `${VIDEOS.length} videos · May–Sep 2026 · updated ${new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"})}`;
}

// ── Chart ──
let chartY = "views";
function toggleChartY(){
  chartY = chartY==="views" ? "vpd" : "views";
  document.getElementById("chart-toggle-lbl").textContent = chartY==="views" ? "Raw views" : "Views per day";
  document.getElementById("ytog").textContent = chartY==="views" ? "Switch to views/day" : "Switch to raw views";
  drawChart();
}

function drawChart(){
  const canvas = document.getElementById("chart");
  const dpr = window.devicePixelRatio||1;
  const W = canvas.offsetWidth;
  const H = 240;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.height = H+"px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr,dpr);

  const dark = isDark();
  const gridColor = dark ? "rgba(255,255,255,0.06)" : "rgba(0,0,0,0.06)";
  const textColor = dark ? "#687080" : "#948E88";
  const bg = dark ? "#101E2C" : "#ECEAE4";

  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  const PAD = {l:44,r:16,t:14,b:32};
  const cw = W - PAD.l - PAD.r;
  const ch = H - PAD.t - PAD.b;

  // Date range
  const dates = VIDEOS.map(v=>new Date(v.publish_date).getTime());
  const minD = Math.min(...dates), maxD = Math.max(...dates);
  const rangeD = maxD - minD || 1;

  const pub = VIDEOS.filter(v=>v.privacy==="public");
  const maxY = Math.max(...pub.map(v=>v[chartY]), 1);

  // Grid lines
  ctx.strokeStyle = gridColor; ctx.lineWidth = 1;
  const ticks = 5;
  for(let i=0;i<=ticks;i++){
    const y = PAD.t + ch - (i/ticks)*ch;
    ctx.beginPath(); ctx.moveTo(PAD.l,y); ctx.lineTo(PAD.l+cw,y); ctx.stroke();
    const val = Math.round((i/ticks)*maxY);
    ctx.fillStyle = textColor; ctx.font = "10px system-ui";
    ctx.textAlign = "right"; ctx.fillText(val, PAD.l-5, y+3.5);
  }

  // X axis labels
  const months = ["May 19","Jun 1","Jun 15","Jul 1","Jul 11"];
  const mDates = ["2026-05-19","2026-06-01","2026-06-15","2026-07-01","2026-07-11"];
  ctx.fillStyle = textColor; ctx.textAlign = "center"; ctx.font = "10px system-ui";
  mDates.forEach((d,i)=>{
    const t = new Date(d).getTime();
    const x = PAD.l + ((t-minD)/rangeD)*cw;
    ctx.fillText(months[i], x, H-PAD.b+14);
    ctx.strokeStyle = gridColor; ctx.beginPath(); ctx.moveTo(x,PAD.t); ctx.lineTo(x,PAD.t+ch); ctx.stroke();
  });

  // Dots
  VIDEOS.forEach(v=>{
    if(v.privacy!=="public") return;
    const t = new Date(v.publish_date).getTime();
    const x = PAD.l + ((t-minD)/rangeD)*cw;
    const y = PAD.t + ch - (v[chartY]/maxY)*ch;
    const col = fmtOf(v).color;
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI*2);
    ctx.fillStyle = col + "CC";
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  // Label top outliers
  const sorted = [...pub].sort((a,b)=>b[chartY]-a[chartY]).slice(0,4);
  ctx.font = "bold 10px system-ui"; ctx.lineWidth = 1;
  sorted.forEach(v=>{
    const t = new Date(v.publish_date).getTime();
    const x = PAD.l + ((t-minD)/rangeD)*cw;
    const y = PAD.t + ch - (v[chartY]/maxY)*ch;
    const label = v.title.slice(0,28)+(v.title.length>28?"…":"");
    const lx = Math.min(x+8, W-PAD.r-ctx.measureText(label).width);
    ctx.fillStyle = dark?"#E4E0D8":"#1C1814";
    ctx.textAlign = "left";
    ctx.fillText(label, lx, y-7);
  });
}

// ── Table ──
let sortKey = "views", sortAsc = false;
function setSort(k){
  if(sortKey===k) sortAsc=!sortAsc; else{sortKey=k; sortAsc=k==="date"||k==="title";}
  document.querySelectorAll(".sort-btn").forEach(b=>b.classList.remove("active"));
  const sb = document.getElementById("s-"+k); if(sb) sb.classList.add("active");
  document.querySelectorAll("thead th[id]").forEach(th=>th.classList.remove("sorted"));
  const th = document.getElementById("th-"+k); if(th) th.classList.add("sorted");
  renderTable();
}

function renderTable(){
  const maxV = Math.max(...VIDEOS.filter(v=>v.privacy==="public").map(v=>v.views),1);
  const sorted = [...VIDEOS].sort((a,b)=>{
    const ka = sortKey==="date"?"publish_date":sortKey;
    let av=a[ka],bv=b[ka];
    if(typeof av==="string") return sortAsc?av.localeCompare(bv):bv.localeCompare(av);
    return sortAsc?av-bv:bv-av;
  });
  document.getElementById("tbody").innerHTML = sorted.map(v=>{
    const f = fmtOf(v);
    const isPub = v.privacy==="public";
    const isPri = v.privacy==="private";
    const pct = isPub ? Math.round((v.views/maxV)*100) : 0;
    const link = isPri
      ? `<span class="vid-title" style="color:var(--text3)">${v.title}</span>`
      : `<span class="vid-title"><a href="${YT}${v.id}" target="_blank">${v.title}</a></span>`;
    return `<tr class="${!isPub&&!isPri?'dim':''}${isPri?' dim':''}">
      <td><div class="vid-date">${v.publish_date.slice(5)}</div></td>
      <td><span class="badge ${f.cls}">${f.label}</span></td>
      <td>${link}</td>
      <td class="r bold">${isPri?'—':v.views.toLocaleString()}</td>
      <td class="r">${isPri?'—':v.vpd}</td>
      <td class="r">${isPri?'—':(v.likes||'—')}</td>
      <td class="bar-cell"><div class="bt"><div class="bf" style="width:${pct}%;background:${f.color}"></div></div></td>
    </tr>`;
  }).join("");
}

// ── Format breakdown ──
function renderBreakdown(){
  const grps = {
    "Motivational Short": {formats:["short-motivation"], color:"var(--c-short)"},
    "Classic Parable":    {formats:["parable","parable-classic"], color:"var(--c-parable)"},
    "Animal Parable":     {formats:["parable-animal"], color:"var(--c-animal)"},
    "Other":              {formats:["legacy","long-monologue"], color:"var(--c-legacy)"},
  };
  document.getElementById("fmtgrid").innerHTML = Object.entries(grps).map(([name,g])=>{
    const vids = VIDEOS.filter(v=>g.formats.includes(v.format)&&v.privacy==="public");
    const total = vids.reduce((s,v)=>s+v.views,0);
    const avgVpd = vids.length ? (vids.reduce((s,v)=>s+v.vpd,0)/vids.length).toFixed(1) : "—";
    return `<div class="fmtcard" style="--fc:${g.color}">
      <div class="fmtcard-name">${name}</div>
      <div class="fmtstats">
        <div><div class="fs-lbl">Videos</div><div class="fs-val">${vids.length}</div></div>
        <div><div class="fs-lbl">Total</div><div class="fs-val">${total.toLocaleString()}</div></div>
        <div><div class="fs-lbl">Avg V/D</div><div class="fs-val">${avgVpd}</div></div>
      </div>
    </div>`;
  }).join("");
}

function toggleTheme(){
  const r=document.documentElement, cur=r.getAttribute("data-theme");
  const next=cur==="dark"?"light":cur==="light"?"dark":(window.matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark");
  r.setAttribute("data-theme",next);
  drawChart();
}

window.addEventListener("resize", ()=>{ drawChart(); });

renderKPIs();
renderTable();
renderBreakdown();
requestAnimationFrame(drawChart);
</script>
